<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HITSYNCVN14 — Starting Soon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307}body{font-family:Arial,Helvetica,sans-serif;color:#fff}
.stage{position:relative;width:100vw;height:100vh;min-width:320px;min-height:180px;overflow:hidden;background:#050609}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.47) contrast(1.12);transform:scale(1.04);animation:bgzoom 24s ease-in-out infinite alternate}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.15) 48%,rgba(0,0,0,.6)),radial-gradient(ellipse at 70% 50%,transparent 0%,rgba(0,0,0,.62) 78%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#8deeff 1px,transparent 1.5px);background-size:95px 95px,151px 151px;background-position:0 0,40px 50px;opacity:.28;animation:stars 28s linear infinite}
.moon-glow{position:absolute;left:8%;top:8%;width:340px;height:340px;border-radius:50%;background:rgba(160,220,255,.10);filter:blur(65px);animation:pulse 5s ease-in-out infinite}
.brand{position:absolute;left:9%;top:17%;width:55%;z-index:3}
.kicker{font-size:clamp(13px,1.4vw,24px);letter-spacing:.48em;color:#9feaff;font-weight:700;text-transform:uppercase;animation:fadeup 1.1s both}
h1{margin:26px 0 10px;font-size:clamp(46px,7.2vw,132px);line-height:.94;letter-spacing:.035em;font-weight:900;text-shadow:0 0 22px rgba(81,213,255,.42);animation:reveal 1.25s cubic-bezier(.2,.8,.2,1) both}
h1 span{display:block;color:#a7edff}
.rule{width:min(520px,75%);height:2px;margin:30px 0;background:linear-gradient(90deg,#8deaff,transparent);box-shadow:0 0 15px #58d9ff;animation:expand 1.5s both}
.sub{font-size:clamp(15px,1.65vw,29px);letter-spacing:.25em;color:#e5faff;font-weight:600;animation:fadeup 1.7s both}
.pill{display:inline-flex;align-items:center;gap:12px;margin-top:35px;padding:13px 22px;border:1px solid rgba(150,231,255,.55);border-radius:999px;background:rgba(5,19,30,.48);font-size:clamp(12px,1.1vw,19px);letter-spacing:.18em;color:#b9f2ff;box-shadow:0 0 25px rgba(69,201,255,.15);animation:fadeup 2s both}
.dot{width:9px;height:9px;border-radius:50%;background:#54e6ff;box-shadow:0 0 14px #54e6ff;animation:blink 1.3s infinite}
.avatar-wrap{position:absolute;right:8%;bottom:0;width:33%;height:88%;z-index:2;display:flex;align-items:flex-end;justify-content:center;animation:avatarIn 1.5s cubic-bezier(.16,.8,.2,1) both}
.avatar-halo{position:absolute;bottom:7%;width:88%;height:75%;border-radius:50%;background:rgba(74,211,255,.14);filter:blur(55px);animation:pulse 4s ease-in-out infinite}
.avatar{position:relative;max-width:100%;max-height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 24px rgba(74,208,255,.32));animation:float 5s ease-in-out infinite}
.corner{position:absolute;right:3%;top:5%;z-index:4;font-size:clamp(10px,.85vw,15px);letter-spacing:.3em;color:rgba(211,245,255,.6)}
.bottom{position:absolute;left:9%;bottom:7%;z-index:4;font-size:clamp(10px,.8vw,14px);letter-spacing:.28em;color:rgba(218,244,255,.58)}
.scan{position:absolute;left:0;right:0;top:-20%;height:2px;z-index:5;background:linear-gradient(90deg,transparent,rgba(126,228,255,.8),transparent);box-shadow:0 0 20px #64dfff;animation:scan 8s linear infinite}
.fadein{position:absolute;inset:0;z-index:10;background:#020307;pointer-events:none;animation:opening 1.7s ease-out forwards}
@keyframes opening{0%{opacity:1}100%{opacity:0}}@keyframes bgzoom{to{transform:scale(1.12)}}@keyframes stars{to{background-position:95px 95px,-111px 201px}}@keyframes pulse{50%{transform:scale(1.12);opacity:.65}}@keyframes fadeup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes reveal{from{opacity:0;transform:translateX(-45px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes expand{from{width:0}to{width:min(520px,75%)}}@keyframes blink{50%{opacity:.3}}@keyframes avatarIn{from{opacity:0;transform:translateY(80px) scale(.94)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-13px)}}@keyframes scan{0%{top:-5%}100%{top:110%}}
@media(max-aspect-ratio:1/1){.brand{left:6%;top:14%;width:65%}.avatar-wrap{right:-4%;width:43%;height:70%}}
